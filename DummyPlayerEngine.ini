; Настройки DummyPlayerEngine
; DummyPlayerEngine settings
;
; 1 = звук двигателя как у NPC, 0 = обычный звук игрока
; 1 = engine sounds like NPC cars, 0 = normal player engine sound
;
; Все настройки, кроме ReloadKey, можно менять прямо в игре (см. ReloadKey в конце)
; All settings except ReloadKey can be changed while playing (see ReloadKey at the end)

[DummyPlayerEngine]
; Машины (в San Andreas также монстр-траки)
; Cars (in San Andreas also monster trucks)
Cars=1

; Мотоциклы (San Andreas, Vice City)
; Motorcycles (San Andreas, Vice City)
Bikes=1

; Квадроциклы (только San Andreas)
; Quad bikes (San Andreas only)
Quads=1

; ---------- Громкость в GTA III и Vice City / Volume in GTA III and Vice City ----------

; Громкость NPC-звука двигателя игрока в процентах
; 100 = как в игре, больше = громче, меньше = тише (0..1000)
; Громкость не может превысить максимум игры, поэтому выше ~160 разница почти не слышна
; Volume of the player's NPC-style engine sound, in percent
; 100 = as in the game, higher = louder, lower = quieter (0..1000)
; The game has a volume limit, so above ~160 the difference is barely audible
Volume=200

; Громкость остальных звуков мира, пока ты в машине или на мотоцикле, в процентах
; 100 = как в игре, 0 = тишина. Звуки твоей машины (двигатель, гудок, шины, удары) не приглушаются.
; Volume of other world sounds while you are in a vehicle, in percent
; 100 = as in the game, 0 = silence. Your own vehicle (engine, horn, tyres, crashes) is not affected.
WorldVolume=60

; ---------- Громкость в San Andreas / Volume in San Andreas ----------
; 100 = как в игре. Поменяй, если хочется громче мотор или тише мир.
; 100 = as in the game. Change these if you want a louder engine or a quieter world.

; Громкость NPC-звука двигателя игрока в процентах (0..1000)
; Volume of the player's NPC-style engine sound, in percent (0..1000)
VolumeSA=100

; Громкость остальных звуков мира, пока ты в машине или на мотоцикле, в процентах (0..100)
; Volume of other world sounds while you are in a vehicle, in percent (0..100)
WorldVolumeSA=100

; ---------- Клавиша / Hotkey ----------

; Клавиша, по которой мод перечитывает этот файл прямо в игре.
; Поменял цифры, сохранил файл, вернулся в игру, нажал клавишу - и сразу слышно разницу.
; Можно F1..F24, букву (R), цифру (5) или код клавиши Windows (0x76). 0 = выключить.
; Меняется только перезапуском игры.
; Key that reloads this file while playing.
; Change the numbers, save the file, go back to the game, press the key - and hear the difference.
; Use F1..F24, a letter (R), a digit (5) or a Windows key code (0x76). 0 = off.
; This setting itself only changes after restarting the game.
ReloadKey=F7
