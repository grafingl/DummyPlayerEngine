; DummyPlayerEngine
; Каждая игра читает свою секцию. / Each game reads its own section.
;
; Cars, Bikes, Quads: 1 = звук NPC, 0 = штатный звук игрока.
; Cars, Bikes, Quads: 1 = NPC engine sound, 0 = original player engine sound.
;
; Volume: громкость NPC-двигателя / NPC engine volume (0..1000%).
; WorldVolume: громкость мира в транспорте / World volume while driving (0..100%).
; 100 = штатная громкость / Default game volume.
;
; ReloadKey: перечитать настройки в игре / Reload settings in-game.
; F1..F12, A..Z, 1..9, 118 or 0x76 = F7. 0 = выключено / disabled.
; Смена ReloadKey требует перезапуска. / Restart the game to change ReloadKey.

